<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>প্রোডাক্ট | Mormo BD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='36' text-anchor='middle' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.pd{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.gal{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:12px}
.gal .hs{gap:0;border-radius:22px;background:#E6DFD3}
.gal .hs img{width:100%;aspect-ratio:3/4;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.thumbs button{padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#E6DFD3;border:2px solid transparent}
.thumbs button.on{border-color:#121212}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:18px;position:sticky;top:84px}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px}
.dots span{height:6px;border-radius:999px;transition:width .2s}
.buybar{display:none}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:400px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #ECE7DF}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
@media (max-width:760px){
  main.wrap{padding:0}
  .gal .hs{border-radius:0}
  .thumbs{display:none}
  .info{position:static;padding:0 16px;margin-top:-28px;background:#F3F0EA;border-radius:26px 26px 0 0;padding-top:20px}
  .pd{gap:0}
  .buybar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(18,18,18,.08);padding:10px 16px 16px;gap:10px;align-items:center}
  .bnav{display:none!important}
  .rel{padding:0 16px}
}
</style>
<script defer src="products.js"></script>
<script defer src="app.js"></script>
<script defer src="alpine.min.js"></script>
</head>
<body data-page="product">
<div id="site-header"></div>

<main class="wrap" x-data="pdp()" style="padding-top:16px">
  <nav aria-label="Breadcrumb" class="muted desk" style="font-size:14px;display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><a href="index.html">হোম</a><span aria-hidden="true">/</span><a :href="'category.html?cat='+encodeURIComponent(p.cat)" x-text="p.cat"></a><span aria-hidden="true">/</span><span aria-current="page" style="color:#121212" x-text="p.t"></span></nav>

  <div class="pd">
    <section class="gal" aria-label="ছবি">
      <div style="position:relative">
        <div class="hs" x-ref="g" @scroll.debounce.60ms="gi = Math.round($refs.g.scrollLeft / $refs.g.clientWidth)" aria-label="ছবি, ডানে-বামে সরান">
          <template x-for="(src, i) in imgs"><img class="snap" :src="src" :alt="i ? p.t+', ছবি '+(i+1) : p.t" :loading="i ? 'lazy' : 'eager'"></template>
        </div>
        <div class="dots mob" aria-hidden="true" x-show="imgs.length>1"><template x-for="(src, i) in imgs"><span :style="'width:'+(i===gi?'22px':'6px')+';background:'+(i===gi?'#fff':'rgba(255,255,255,.6)')"></span></template></div>
        <button type="button" class="heart" style="top:14px;right:14px;width:44px;height:44px" aria-label="পছন্দের তালিকায় রাখুন" :aria-pressed="$store.shop.isWished(p.id)" @click="$store.shop.toggleWish(p.id)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" stroke="#8A1C2B" stroke-width="2" stroke-linejoin="round" :fill="$store.shop.isWished(p.id)?'#8A1C2B':'none'"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      </div>
      <div class="thumbs" x-show="imgs.length>1"><template x-for="(src, i) in imgs"><button type="button" :class="i===gi && 'on'" :aria-label="'ছবি '+(i+1)" @click="go(i)"><img :src="src" alt=""></button></template></div>
    </section>

    <section class="info" aria-label="প্রোডাক্টের তথ্য">
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="eyebrow" :href="'category.html?cat='+encodeURIComponent(p.cat)" x-text="p.cat"></a>
        <h1 style="margin:0;font-size:clamp(22px,3vw,32px);line-height:1.2;font-weight:900" x-text="p.t"></h1>
        <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><span style="font-size:30px;font-weight:900" x-text="M.fmt(p.p)"></span><span x-show="!p.stock" style="background:#5A5650;color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px">স্টক শেষ</span></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px" x-show="p.sizes.length">
        <div style="display:flex;justify-content:space-between;align-items:center"><strong>সাইজ: <span class="muted" style="font-weight:400" x-text="size || 'বাছাই করা হয়নি'"></span></strong><a href="#chart" x-show="hasChart" @click="chartOpen=true" style="font-size:14px;font-weight:700;color:#8A1C2B;text-decoration:underline;padding:10px 0">সাইজ চার্ট</a></div>
        <div role="group" aria-label="সাইজ বাছুন" style="display:flex;flex-wrap:wrap;gap:8px"><template x-for="s in p.sizes"><button type="button" class="size" :class="size===s && 'on'" :aria-pressed="size===s" @click="size=s; err=false" x-text="s"></button></template></div>
        <p role="alert" class="err" x-show="err" style="margin:0">আগে একটা সাইজ বাছুন</p>
        <template x-if="hasChart">
          <div style="background:#fff;border:1px dashed #CFC8BC;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><label for="pw" style="font-size:14px;font-weight:700">সাইজ জানেন না? কোমর: <span x-text="waist+'&quot;'"></span></label><button type="button" @click="size=M.recommend(waist).s; err=false" style="height:40px;padding:0 14px;border-radius:999px;border:0;background:#8A1C2B;color:#fff;font-weight:700;font-size:13px" x-text="M.recommend(waist).s+' বেছে নিন'"></button></div>
            <input id="pw" type="range" min="24" max="40" x-model.number="waist" style="width:100%;height:36px;accent-color:#8A1C2B">
          </div>
        </template>
      </div>

      <div class="desk" style="display:flex;gap:10px;flex-wrap:wrap" x-show="p.stock">
        <span class="qty" style="height:56px"><button type="button" aria-label="পরিমাণ কমান" @click="qty=Math.max(1,qty-1)" style="height:52px">−</button><span x-text="qty"></span><button type="button" aria-label="পরিমাণ বাড়ান" @click="qty=Math.min(10,qty+1)" style="height:52px">+</button></span>
        <button type="button" class="btn line" style="flex:1 1 180px;height:56px" @click="add()">কার্টে যোগ করুন</button>
        <button type="button" class="btn block" style="height:56px" @click="buy()">এখনই অর্ডার করুন · ক্যাশ অন ডেলিভারি</button>
      </div>

      <div class="box" style="padding:4px 18px">
        <div style="display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ECE7DF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A1C2B" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span style="font-size:15px"><b>ক্যাশ অন ডেলিভারি</b> · হাতে পেয়ে টাকা দিন</span></div>
        <div style="display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ECE7DF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A1C2B" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg><span style="font-size:15px"><b>ঢাকায় [X] দিন</b> · বাইরে [Y] দিন</span></div>
        <div style="display:flex;gap:12px;align-items:center;padding:13px 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A1C2B" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg><span style="font-size:15px"><b>সাইজ না মিললে এক্সচেঞ্জ</b> · [নীতি]</span></div>
      </div>

      <a :href="M.WA+'?text='+encodeURIComponent('এই প্রোডাক্টের সাইজ নিয়ে জানতে চাই: '+p.t)" style="display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:999px;background:#E9F5EC;color:#14532D;font-weight:700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14532D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>সাইজ নিয়ে প্রশ্ন? WhatsApp করুন</a>

      <details class="box" style="padding:0 18px" open x-show="p.d"><summary style="padding:16px 0;font-weight:800">বিস্তারিত</summary><p style="margin:0 0 16px;line-height:1.75;color:#3D3A35" x-text="p.d"></p></details>
      <details id="chart" class="box" style="padding:0 18px" x-show="hasChart" :open="chartOpen"><summary style="padding:16px 0;font-weight:800">সাইজ চার্ট (ইঞ্চি)</summary>
        <div style="overflow-x:auto;margin-bottom:16px"><table><thead><tr><th>সাইজ</th><th>বুক</th><th>টপের লম্বা</th><th>কোমর</th><th>প্যান্টের লম্বা</th></tr></thead>
        <tbody><template x-for="r in M.chart"><tr :style="r.s===size ? 'background:#F3F0EA;font-weight:700' : ''"><td x-text="r.s"></td><td x-text="r.chest"></td><td x-text="r.top"></td><td x-text="r.waist"></td><td x-text="r.pant"></td></tr></template></tbody></table></div>
      </details>
    </section>
  </div>

  <section class="rel" style="margin-top:56px" aria-labelledby="rel-h" x-show="related.length">
    <h2 id="rel-h" class="h2" style="margin-bottom:18px;font-size:28px">এর সাথে আরও দেখুন</h2>
    <div class="grid">
      <template x-for="r in related" :key="r.id">
        <article class="card">
          <div class="ph"><a :href="M.url(r)"><img :src="r.img" :alt="r.t" loading="lazy"></a><button type="button" class="fab" :aria-label="r.t+' দ্রুত কার্টে যোগ করুন'" @click="$store.shop.openQuick(r.id)">+</button></div>
          <a :href="M.url(r)" class="nm" x-text="r.t"></a><div class="pr" x-text="M.fmt(r.p)"></div>
        </article>
      </template>
    </div>
  </section>

  <div class="buybar" x-show="p.stock">
    <a :href="M.WA+'?text='+encodeURIComponent('অর্ডার করতে চাই: '+p.t)" aria-label="WhatsApp-এ জিজ্ঞেস করুন" style="width:52px;height:52px;border-radius:999px;background:#E9F5EC;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14532D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg></a>
    <button type="button" class="btn line" style="flex:none;height:52px;padding:0 16px;font-size:14px" @click="add()">কার্টে</button>
    <button type="button" class="btn" style="flex:1;height:52px;padding:0 12px" @click="buy()" x-text="'অর্ডার করুন · '+M.fmt(p.p)"></button>
  </div>
</main>

<div id="site-footer"></div>
<script>
function pdp() {
  const p = M.byId(M.q('id')) || M.P[0];
  document.title = p.t + ' | Mormo BD';
  const chartSizes = M.chart.map((r) => r.s);
  return {
    p, size: p.sizes.length === 1 ? p.sizes[0] : null, qty: 1, err: false, gi: 0, waist: 30, chartOpen: false,
    imgs: [p.img].concat(p.gal).filter((v, i, a) => a.indexOf(v) === i),
    hasChart: p.sizes.length > 0 && p.sizes.every((s) => chartSizes.includes(s)),
    related: M.P.filter((r) => r.cat === p.cat && r.id !== p.id && r.stock).slice(0, 8),
    go(i) { this.gi = i; this.$refs.g.scrollTo({ left: i * this.$refs.g.clientWidth, behavior: 'smooth' }); },
    ok() { if (!this.size) { this.err = true; document.querySelector('[aria-label="সাইজ বাছুন"]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; } return true; },
    add() { if (this.ok()) this.$store.shop.add(p.id, this.size, this.qty); },
    buy() { if (!this.ok()) return; this.$store.shop.add(p.id, this.size, this.qty); location.href = 'checkout.html'; }
  };
}
</script>
</body>
</html>

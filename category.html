<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>শপ | Mormo BD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='36' text-anchor='middle' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script defer src="products.js"></script>
<script defer src="app.js"></script>
<script defer src="alpine.min.js"></script>
</head>
<body data-page="cat">
<div id="site-header"></div>

<main class="wrap" x-data="shop()" x-init="init()" style="padding-top:20px">
  <nav aria-label="Breadcrumb" class="muted" style="font-size:14px;display:flex;gap:8px;margin-bottom:12px"><a href="index.html">হোম</a><span aria-hidden="true">/</span><span aria-current="page" style="color:#121212" x-text="heading"></span></nav>
  <h1 style="margin:0 0 8px;font-size:clamp(28px,5vw,44px);line-height:1.1;font-weight:900" x-text="heading"></h1>
  <p class="muted" style="margin:0 0 18px;max-width:640px;line-height:1.6" x-text="intro"></p>

  <div style="position:sticky;top:66px;z-index:5;background:#F3F0EA;padding:10px 0 12px;border-bottom:1px solid #DCD6CC;margin-bottom:20px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #DCD6CC;border-radius:999px;padding:0 16px;height:46px">
      <label for="sq" class="sr">প্রোডাক্ট খুঁজুন</label>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A5650" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="sq" x-ref="q" type="search" x-model.debounce.200ms="q" @input="shown=24" placeholder="খুঁজুন: baggy, hoodie, black, crop…" style="border:0;background:transparent;font:inherit;font-size:16px;flex:1;min-width:0;outline:none">
    </div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div class="hs" role="group" aria-label="ক্যাটাগরি" style="scroll-snap-type:none;flex:1;min-width:0">
        <template x-for="c in chips"><button type="button" class="chip" :class="c.on && 'on'" :aria-pressed="c.on" @click="setCat(c.id)"><span x-text="c.label"></span><span style="opacity:.6;font-weight:600" x-text="c.n"></span></button></template>
      </div>
      <label class="desk" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px">সাজান
        <select x-model="sort" style="height:42px;border-radius:999px;border:1.5px solid #CFC8BC;background:#fff;padding:0 12px;font:inherit;font-size:14px">
          <option value="new">নতুন আগে</option><option value="low">দাম: কম থেকে বেশি</option><option value="high">দাম: বেশি থেকে কম</option>
        </select>
      </label>
    </div>
    <div class="mob hs" style="scroll-snap-type:none" role="group" aria-label="সাজান">
      <button type="button" class="chip" :class="sort==='new'&&'on'" @click="sort='new'">নতুন আগে</button>
      <button type="button" class="chip" :class="sort==='low'&&'on'" @click="sort='low'">দাম কম</button>
      <button type="button" class="chip" :class="sort==='high'&&'on'" @click="sort='high'">দাম বেশি</button>
    </div>
  </div>

  <p aria-live="polite" class="muted" style="margin:0 0 14px;font-size:14px" x-text="list.length+'টি প্রোডাক্ট'"></p>

  <div class="grid">
    <template x-for="p in list.slice(0, shown)" :key="p.id">
      <article class="card">
        <div class="ph">
          <a :href="M.url(p)"><img :src="p.img" :alt="p.t" loading="lazy"></a>
          <span class="tag out" x-show="!p.stock">স্টক শেষ</span>
          <button type="button" class="heart" aria-label="পছন্দের তালিকায় রাখুন" :aria-pressed="$store.shop.isWished(p.id)" @click="$store.shop.toggleWish(p.id)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" stroke="#8A1C2B" stroke-width="2" stroke-linejoin="round" :fill="$store.shop.isWished(p.id)?'#8A1C2B':'none'"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
          <button type="button" class="fab" x-show="p.stock" :aria-label="p.t+' দ্রুত কার্টে যোগ করুন'" @click="$store.shop.openQuick(p.id)">+</button>
        </div>
        <a :href="M.url(p)" class="nm" x-text="p.t"></a>
        <div class="pr" x-text="M.fmt(p.p)"></div>
      </article>
    </template>
  </div>

  <div x-show="!list.length" style="text-align:center;padding:60px 0">
    <p class="muted" x-text="wish ? 'পছন্দের তালিকা খালি। প্রোডাক্টের ♥ চাপলে এখানে জমা হবে।' : 'কিছু পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।'"></p>
    <a href="category.html" class="btn" style="margin-top:10px">সব প্রোডাক্ট দেখুন</a>
  </div>
  <div x-show="list.length > shown" style="text-align:center;margin-top:28px">
    <button type="button" class="btn line" @click="shown += 24" x-text="'আরও দেখুন ('+(list.length-shown)+'টি বাকি)'"></button>
  </div>
</main>

<div id="site-footer"></div>
<script>
function shop() {
  const INTRO = {
    'Baggy Pant': 'মেয়েদের বেগি আর ওয়াইড লেগ প্যান্ট। প্রিন্ট, প্লেইন আর কার্গো, XS থেকে 5XL।',
    'Crop Top Set': 'ক্রপ টপ আর প্যান্টের কো-অর্ড সেট। একটা সেটেই পুরো লুক।',
    'Winter Collection': 'হুডি, সোয়েটশার্ট আর ওয়াইড লেগ প্যান্টের শীতের সেট।',
    'Combo Set': 'একসাথে কিনলে বেশি সুবিধা, কম্বো সেট।',
    'Shorts': 'হালকা আর আরামের শর্টস।'
  };
  return {
    cat: M.q('cat') || '', q: M.q('q') || '', sort: 'new', shown: 24, wish: !!M.q('wish'),
    init() { if (M.q('focus')) this.$nextTick(() => this.$refs.q.focus()); },
    setCat(c) { this.cat = c; this.wish = false; this.shown = 24; history.replaceState(null, '', c ? '?cat=' + encodeURIComponent(c) : 'category.html'); },
    get heading() { return this.wish ? 'পছন্দের তালিকা' : (this.q && !this.cat ? '“' + this.q + '” খোঁজার ফল' : (this.cat || 'সব প্রোডাক্ট')); },
    get intro() { return this.wish ? 'যেগুলো ♥ দিয়েছেন। এই ফোনেই জমা থাকে।' : (INTRO[this.cat] || 'Mormo BD-র সব স্ট্রিটওয়্যার। সারা দেশে ক্যাশ অন ডেলিভারি।'); },
    get chips() {
      const base = this.q ? M.search(this.q) : M.P;
      return [{ id: '', label: 'সব', n: base.length }].concat(M.CATS.map((c) => ({ id: c, label: c, n: base.filter((p) => p.cat === c).length })))
        .filter((c) => c.n).map((c) => ({ ...c, on: !this.wish && c.id === this.cat }));
    },
    get list() {
      let l = this.wish ? M.P.filter((p) => this.$store.shop.wish.includes(p.id)) : (this.q ? M.search(this.q) : M.P);
      if (this.cat && !this.wish) l = l.filter((p) => p.cat === this.cat);
      l = l.slice().sort((a, b) => (b.stock - a.stock) || (this.sort === 'low' ? a.p - b.p : this.sort === 'high' ? b.p - a.p : b.id - a.id));
      return l;
    }
  };
}
</script>
</body>
</html>

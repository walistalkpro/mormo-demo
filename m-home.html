<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>মোবাইল হোম | Mormo BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F0EA}
a{color:#121212;text-decoration:none}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start;flex:none}
.sheet{animation:up .28s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.toast{animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.ring{background:conic-gradient(#8A1C2B,#E9B9A0,#8A1C2B);padding:3px;border-radius:999px}
button,a{transition:transform .12s ease}
button:active,a:active{transform:scale(.97)}
.bump{animation:bp .4s ease}
@keyframes bp{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.bump{animation:none}button:active,a:active{transform:none}}
</style>
<style>[x-cloak]{display:none}</style>
<script>
class Base { constructor(props) { this.props = props || {}; } }
class Component extends Base {
  constructor(props) {
    super(props);
    this.state = { slide: 0, story: 0, tab: 'home', waist: 30, cart: 2, sheet: null, size: null, toast: '', wished: {} };
  }
  renderVals() {
    const IM = {
      maroon: 'img/cutout-set-maroon.webp',
      black: 'img/cutout-set-black.webp',
      beige: 'img/cutout-set-beige.webp',
      ny: 'img/new-york-3-piece-set.webp',
      bk: 'img/brooklyn-3-piece-set.webp'
    };
    const slideDefs = [
      { label: 'মেরুন', img: IM.maroon, bg: '#4A1219', alt: 'মেরুন কাটআউট হুডি বডিস্যুট সেট' },
      { label: 'কালো', img: IM.black, bg: '#121212', alt: 'কালো কাটআউট হুডি বডিস্যুট সেট' },
      { label: 'বেইজ', img: IM.beige, bg: '#5B4A36', alt: 'বেইজ কাটআউট হুডি বডিস্যুট সেট' }
    ];
    const dots = slideDefs.map((s, i) => ({ w: i === this.state.slide ? '22px' : '6px', c: i === this.state.slide ? '#121212' : '#CFC8BC' }));
    const storyDefs = [
      { t: 'Winter', img: IM.black, bg: '#121212' },
      { t: 'Baggy Pant', img: IM.beige, bg: '#E6DFD3' },
      { t: 'Crop Top Set', img: IM.bk, bg: '#E6DFD3' },
      { t: 'Combo Set', img: IM.ny, bg: '#E6DFD3' },
      { t: 'নতুন', img: IM.maroon, bg: '#4A1219' }
    ];
    const stories = storyDefs.map((s, i) => ({ ...s, op: i === this.state.story ? 1 : 0.55, pick: () => this.setState({ story: i }) }));
    const prods = [
      { id: 'mr', name: 'Cutout Hoodie Set · মেরুন', price: '2,700৳', img: IM.maroon, alt: 'মেরুন কাটআউট হুডি সেট' },
      { id: 'ny', name: 'Cream New York 3-Piece Set', price: '[দাম]৳', img: IM.ny, alt: 'ক্রিম New York ক্রপ হুডি সেট' },
      { id: 'bk', name: 'Black Brooklyn 3-Piece Set', price: '[দাম]৳', img: IM.bk, alt: 'কালো Brooklyn ক্রপ হুডি সেট' },
      { id: 'bg', name: 'Cutout Hoodie Set · বেইজ', price: '2,700৳', img: IM.beige, alt: 'বেইজ কাটআউট হুডি সেট' }
    ];
    const wished = this.state.wished;
    const grid = prods.map((p) => ({
      ...p,
      wished: wished[p.id] ? 'true' : 'false',
      heart: wished[p.id] ? '#8A1C2B' : 'none',
      wish: () => this.setState({ wished: { ...wished, [p.id]: !wished[p.id] } }),
      quick: () => this.setState({ sheet: p, size: null, toast: '' })
    }));
    const chart = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL'];
    const mids = [26, 28, 30, 32, 34, 36, 38];
    const w = Number(this.state.waist);
    let ri = 0;
    mids.forEach((m, i) => { if (Math.abs(m - w) < Math.abs(mids[ri] - w)) ri = i; });
    const sizes = chart.map((s) => {
      const on = s === this.state.size;
      return { s, pressed: on ? 'true' : 'false', bg: on ? '#121212' : '#FFFFFF', fg: on ? '#FFFFFF' : '#121212', border: on ? '#121212' : '#DCD6CC', pick: () => this.setState({ size: s }) };
    });
    const tabDefs = [
      { id: 'home', t: 'হোম', icon: 'M4 11l8-7 8 7v9H4z' },
      { id: 'cat', t: 'ক্যাটাগরি', icon: 'M4 6h16M4 12h16M4 18h16' },
      { id: 'wish', t: 'পছন্দ', icon: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' },
      { id: 'cart', t: 'কার্ট', icon: 'M5 7h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 7z' }
    ];
    const tabs = tabDefs.map((t) => {
      const on = t.id === this.state.tab;
      return { ...t, current: on ? 'page' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#121212' : '#CFC8BC', pick: () => this.setState({ tab: t.id }) };
    });
    const sheet = this.state.sheet;
    return {
      cartCount: this.state.cart,
      openCart: () => this.setState({ tab: 'cart' }),
      stories,
      slides: slideDefs,
      dots,
      onHeroScroll: (e) => {
        const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
        if (i !== this.state.slide) this.setState({ slide: i });
      },
      grid,
      waist: w,
      rec: chart[ri],
      setWaist: (e) => this.setState({ waist: e.target.value }),
      tabs,
      toast: this.state.toast,
      sheetOpen: !!sheet,
      sheetItem: sheet || { img: '', name: '', price: '' },
      closeSheet: () => this.setState({ sheet: null }),
      sizes,
      addBg: this.state.size ? '#121212' : '#8A8580',
      addLabel: this.state.size ? 'সাইজ ' + this.state.size + ' · কার্টে যোগ করুন' : 'আগে সাইজ বাছুন',
      confirmAdd: () => {
        if (!this.state.size) return;
        this.setState({ sheet: null, cart: this.state.cart + 1, toast: 'সাইজ ' + this.state.size + ' কার্টে যোগ হয়েছে' });
      }
    };
  }
}
document.addEventListener('alpine:init', () => {
  Alpine.data('page', () => {
    const c = new Component({});
    const o = {
      state: c.state, props: {}, gal: null,
      setState(p) { Object.assign(this.state, p); },
      get v() { return Component.prototype.renderVals.call(this); }
    };
    Object.getOwnPropertyNames(Component.prototype).forEach((k) => {
      if (k !== 'constructor' && k !== 'renderVals') o[k] = Component.prototype[k];
    });
    return o;
  });
});
</script>
<script defer src="alpine.min.js"></script>
</head>
<body>
<div x-data="page" style="width: 100%; max-width: 480px; margin: 0 auto; height: 100dvh; position: relative; overflow: hidden; background: #F3F0EA; font-family: 'Archivo', 'Hind Siliguri', sans-serif; color: #121212; display: flex; flex-direction: column">

<header style="flex: none; background: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECE7DF">
<a href="#" style="font-weight: 900; font-size: 22px; letter-spacing: 0.1em">MORMO<span style="color: #8A1C2B">.</span></a>
<div style="display: flex; gap: 4px">
<button type="button" aria-label="খুঁজুন" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button type="button" @click="v.openCart($event)" :aria-label="`কার্ট, ${v.cartCount}টি`" style="position: relative; width: 44px; height: 44px; border: 0; background: #121212; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg><span class="bump" style="position: absolute; top: -3px; right: -3px; background: #8A1C2B; color: #FFFFFF; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span x-text="v.cartCount"></span></span></button>
</div>
</header>

<div style="flex: 1; overflow-y: auto; padding-bottom: 90px">

<div class="hs" aria-label="ক্যাটাগরি" style="gap: 14px; padding: 16px 16px 8px">
<template x-for="st in v.stories">
<button type="button" @click="st.pick($event)" style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer; font: inherit; width: 72px; padding: 0">
<span class="ring" :style="`opacity: ${st.op}`"><span :style="`display: block; width: 62px; height: 62px; border-radius: 999px; border: 3px solid #F3F0EA; overflow: hidden; background: ${st.bg}`"><img :src="st.img" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></span></span>
<span style="font-size: 12px; font-weight: 600; color: #121212; text-align: center; line-height: 1.2"><span x-text="st.t"></span></span>
</button>
</template>
</div>

<section aria-label="নতুন কালেকশন" style="padding: 8px 16px 0">
<div class="hs" @scroll="v.onHeroScroll($event)" style="border-radius: 22px; gap: 0">
<template x-for="sl in v.slides">
<a href="m-product.html" class="snap" :style="`width: 100%; height: 440px; position: relative; display: block; background: ${sl.bg}`">
<img :src="sl.img" :alt="sl.alt" style="width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; inset: auto 0 0 0; padding: 60px 18px 18px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F2C9B8">Winter Drop · <span x-text="sl.label"></span></span>
<span style="font-size: 24px; font-weight: 900; line-height: 1.15">Cutout Hoodie Bodysuit Set</span>
<span style="font-size: 16px; font-weight: 700">2,700৳ <s style="opacity: 0.7; font-weight: 400">3,500৳</s></span>
</span>
</a>
</template>
</div>
<div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px; padding: 10px 0 0">
<template x-for="d in v.dots"><span :style="`height: 6px; width: ${d.w}; border-radius: 999px; background: ${d.c}; transition: width .2s`"></span></template>
</div>
</section>

<div class="hs" style="gap: 8px; padding: 16px 16px 4px">
<span style="flex: none; background: #FFFFFF; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600">ক্যাশ অন ডেলিভারি</span>
<span style="flex: none; background: #FFFFFF; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600">XS–5XL</span>
<span style="flex: none; background: #FFFFFF; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600">ঢাকায় [X] দিনে</span>
<span style="flex: none; background: #FFFFFF; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600">সহজ এক্সচেঞ্জ</span>
</div>

<section aria-labelledby="mn-h" style="padding: 20px 16px 0">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px"><h2 id="mn-h" style="margin: 0; font-size: 22px; font-weight: 900">নতুন এসেছে</h2><a href="#" style="font-size: 14px; font-weight: 700; padding: 10px 0">সব →</a></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<template x-for="g in v.grid">
<article style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; border-radius: 16px; overflow: hidden; background: #E6DFD3; aspect-ratio: 3 / 4">
<img :src="g.img" :alt="g.alt" style="width: 100%; height: 100%; object-fit: cover; display: block">
<button type="button" @click="g.wish($event)" aria-label="পছন্দের তালিকায় রাখুন" :aria-pressed="g.wished" style="position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.92); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" :fill="g.heart" stroke="#8A1C2B" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<button type="button" @click="g.quick($event)" :aria-label="`${g.name} দ্রুত কার্টে যোগ করুন`" style="position: absolute; right: 6px; bottom: 6px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #121212; color: #FFFFFF; font-size: 24px; line-height: 1; cursor: pointer">+</button>
</div>
<span style="font-size: 13px; font-weight: 600; line-height: 1.35"><span x-text="g.name"></span></span>
<span style="font-size: 15px; font-weight: 900"><span x-text="g.price"></span></span>
</article>
</template>
</div>
</section>

<section aria-labelledby="ms-h" style="margin: 24px 16px 0; background: #121212; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="ms-h" style="margin: 0; font-size: 20px; font-weight: 900">কোমরের মাপ দিন, সাইজ বলে দেব</h2>
<div style="display: flex; justify-content: space-between; align-items: end"><label for="mw" style="color: #CFC8BC; font-size: 14px">কোমর: <strong style="color: #FFFFFF; font-size: 20px"><span x-text="v.waist"></span>"</strong></label><span style="font-size: 52px; line-height: 1; font-weight: 900"><span x-text="v.rec"></span></span></div>
<input id="mw" type="range" min="24" max="40" :value="v.waist" @input="v.setWaist($event)" style="width: 100%; height: 44px; accent-color: #E9B9A0">
</section>

<a href="#" style="margin: 16px 16px 0; display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 999px; background: #E9F5EC; color: #14532D; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14532D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg>প্রশ্ন? WhatsApp করুন</a>
</div>

<nav aria-label="মোবাইল মেনু" style="position: absolute; left: 12px; right: 12px; bottom: 14px; background: rgba(18,18,18,0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 999px; display: flex; justify-content: space-around; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,0.25)">
<template x-for="tb in v.tabs">
<button type="button" @click="tb.pick($event)" :aria-current="tb.current" :style="`flex: 1; height: 52px; border: 0; border-radius: 999px; background: ${tb.bg}; color: ${tb.fg}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: background .2s`">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path :d="tb.icon"></path></svg><span x-text="tb.t"></span>
</button>
</template>
</nav>

<template x-if="v.toast">
<div class="toast" role="status" style="position: absolute; left: 16px; right: 16px; bottom: 86px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.2); padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #1F6B2A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="flex: 1; font-size: 14px; font-weight: 600"><span x-text="v.toast"></span></span>
<a href="m-product.html" style="font-size: 14px; font-weight: 800; color: #8A1C2B; padding: 10px 4px">অর্ডার →</a>
</div>
</template>

<template x-if="v.sheetOpen">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end">
<button type="button" @click="v.closeSheet($event)" aria-label="বন্ধ করুন" style="position: absolute; inset: 0; border: 0; background: rgba(18,18,18,0.5); cursor: pointer"></button>
<div class="sheet" role="dialog" aria-label="সাইজ বাছুন" style="position: relative; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #DCD6CC"></span>
<div style="display: flex; gap: 12px; align-items: center">
<img :src="v.sheetItem.img" alt="" style="width: 60px; height: 76px; border-radius: 12px; object-fit: cover">
<div style="flex: 1; min-width: 0"><div style="font-weight: 700; font-size: 15px; line-height: 1.35"><span x-text="v.sheetItem.name"></span></div><div style="font-weight: 900; font-size: 18px"><span x-text="v.sheetItem.price"></span></div></div>
</div>
<div style="font-weight: 700">সাইজ বাছুন</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<template x-for="s in v.sizes">
<button type="button" @click="s.pick($event)" :aria-pressed="s.pressed" :style="`height: 48px; border-radius: 12px; border: 1.5px solid ${s.border}; background: ${s.bg}; color: ${s.fg}; font: inherit; font-weight: 700; cursor: pointer`"><span x-text="s.s"></span></button>
</template>
</div>
<button type="button" @click="v.confirmAdd($event)" :style="`height: 56px; border-radius: 999px; border: 0; background: ${v.addBg}; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer`"><span x-text="v.addLabel"></span></button>
</div>
</div>
</template>

</div>
</body>
</html>
